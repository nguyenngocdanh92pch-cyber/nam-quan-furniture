<section class="w-full flex justify-center bg-white pt-0 pb-5">
  <div
    class="w-full max-w-[1440px] h-auto md:h-[479px] relative flex flex-col md:flex-row items-center md:items-end justify-center md:justify-end"
  >
    <!-- Nền xanh lá mạ -->
    <div
      class="absolute top-[100px] right-0 w-full h-[280px] bg-[#d7f5d6] z-[1]"
    ></div>
    <!-- Ảnh -->
    <div
      class="absolute top-0 left-0 w-full md:w-[533px] h-[250px] md:h-[479px] bg-[url('../../assets/section11/image.png')] bg-left bg-no-repeat bg-cover z-[2]"
    ></div>

    <div
      class="w-full md:w-[calc(100%-533px)] px-5 md:pr-[120px] pb-10 md:pb-[110px] flex flex-col items-center md:items-end text-center md:text-right z-[3] relative pt-[280px] md:pt-0"
    >
      <h2
        class="font-manrope text-2xl md:text-[28px] font-extrabold text-[#219653] mb-4 uppercase whitespace-normal md:whitespace-nowrap"
      >
        KIẾN TẠO KHÔNG GIAN SỐNG THEO PHONG CÁCH CỦA BẠN
      </h2>
      <p
        class="font-bevietnam text-base font-medium text-[#181d27] leading-relaxed mb-10"
      >
        Để lại thông tin, đội ngũ Nam Quan sẽ liên hệ tư vấn miễn phí<br />và
        giúp bạn lựa chọn giải pháp nội thất phù hợp nhất.
      </p>

      <form
        class="flex flex-col md:flex-row gap-3 w-full justify-center md:justify-end items-center"
        action="#"
        method="POST"
      >
        <input
          type="text"
          class="w-full max-w-[320px] md:w-[275px] h-[48px] bg-[#fdfdfd] border border-[#d5d7da] rounded px-6 py-2 font-bevietnam text-sm text-[#333333] outline-none transition-colors focus:border-[#219653]"
          placeholder="Họ và tên"
          required
        />
        <input
          type="tel"
          class="w-full max-w-[320px] md:w-[275px] h-[48px] bg-[#fdfdfd] border border-[#d5d7da] rounded px-6 py-2 font-bevietnam text-sm text-[#333333] outline-none transition-colors focus:border-[#219653]"
          placeholder="Số điện thoại"
          required
        />
        <button
          type="submit"
          class="w-full max-w-[320px] md:w-auto h-[48px] px-8 bg-gradient-to-b from-[#00c64a] to-[#008b34] rounded text-white font-bevietnam text-base font-bold cursor-pointer transition-all shadow-[0px_4px_6px_rgba(0,166,62,0.3)] hover:-translate-y-0.5 hover:shadow-[0px_6px_12px_rgba(0,166,62,0.4)]"
        >
          Gửi yêu cầu
        </button>
      </form>
    </div>
